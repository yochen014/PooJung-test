<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 確保在手機上比例正確 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>媽媽的靈感百寶箱</title>
  <style>
    /* 全局設定，模擬手機 App 質感 */
    :root {
      --primary-color: #8E44AD; /* 葡萄王/葡眾的紫色系 */
      --bg-color: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #333333;
      --text-sub: #666666;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #EFEFEF;
    }
    /* 限制最大寬度，在電腦上看也像手機介面 */
    #app-container {
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--bg-color);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    /* 分類導覽列 */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 15px 0;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.3s;
    }
    .tab.active {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
    }
    /* 卡片列表區 */
    .content-area {
      padding: 16px;
      height: calc(100vh - 130px);
      overflow-y: auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    /* 點擊時的動態回饋 */
    .card:active {
      transform: scale(0.96);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .card-tag {
      display: inline-block;
      font-size: 12px;
      background: #F0E6F6;
      color: var(--primary-color);
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
      margin: 0 0 8px 0;
    }
    .card-preview {
      font-size: 15px;
      color: var(--text-sub);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* 底部滑出視窗 (Bottom Sheet) */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
      transform: translateY(100%); /* 預設藏在底部 */
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }
    .bottom-sheet.show {
      transform: translateY(0);
    }
    .sheet-header {
      padding: 16px;
      text-align: center;
      position: relative;
      border-bottom: 1px solid #eee;
    }
    .drag-handle {
      width: 40px;
      height: 5px;
      background: #ddd;
      border-radius: 3px;
      margin: 0 auto 10px auto;
    }
    .close-btn {
      position: absolute;
      right: 16px;
      top: 16px;
      font-size: 24px;
      color: #999;
      background: none;
      border: none;
      cursor: pointer;
    }
    .sheet-body {
      padding: 20px;
      overflow-y: auto;
      font-size: 16px;
      color: var(--text-main);
      line-height: 1.6;
    }
    .script-box {
      background: #F9F9F9;
      border-left: 4px solid var(--primary-color);
      padding: 12px;
      margin-top: 16px;
      border-radius: 0 8px 8px 0;
      white-space: pre-wrap; /* 保留換行格式 */
    }
    .copy-btn {
      margin: 20px 20px 30px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .copy-btn.success {
      background-color: #27AE60; /* 成功複製變成綠色 */
    }
    /* 遮罩層 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 5;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

<div id="app-container">
  <header>葡眾靈感百寶箱</header>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('health')">健康保養</div>
    <div class="tab" onclick="switchTab('business')">事業經營</div>
    <div class="tab" onclick="switchTab('script')">破冰話術</div>
  </div>

  <!-- 卡片將由 JS 渲染到這裡 -->
  <div class="content-area" id="card-list"></div>

  <!-- 遮罩層 -->
  <div class="overlay" id="overlay" onclick="closeSheet()"></div>

  <!-- 底部滑出視窗 -->
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-header">
      <div class="drag-handle"></div>
      <button class="close-btn" onclick="closeSheet()">×</button>
      <h3 style="margin:0;" id="sheet-title">標題</h3>
    </div>
    <div class="sheet-body">
      <p id="sheet-desc"></p>
      <div class="script-box" id="sheet-script"></div>
    </div>
    <button class="copy-btn" id="copy-btn" onclick="copyText()">點我複製內文</button>
  </div>
</div>

<script>
  // 模擬從資料庫抓來的這週資料
  const mockData = {
    health: [
      {
        title: "換季過敏哈啾？腸道好菌是關鍵",
        preview: "最近天氣忽冷忽熱，身邊很多人開始過敏，這是一個很好的切入點...",
        desc: "葡萄王生技的研發優勢在於掌握獨特菌種。腸道是人體最大的免疫器官，當天氣變化引起過敏時，補充益生菌能有效調整體質。",
        script: "早安呀！最近天氣變涼了，看你臉書去帶小孩去露營，有夠讚的！要多注意保暖喔，我自己最近都靠喝 995 補充體力，小朋友有沒有哈啾過敏呀？"
      },
      {
        title: "上班族必備：護肝與精神救星",
        preview: "針對經常加班、熬夜的客群，主打樟芝益的保健觀念。",
        desc: "現代人壓力大、睡眠不足，樟芝益針對護肝有很好的調節作用。這週可以特別關心在科技業或輪班工作的朋友。",
        script: "最近看你限時動態常常加班到好晚，辛苦了！我們家最近有一批樟芝益，對熬夜恢復精神很有感，下次碰面帶幾瓶給你喝喝看！"
      }
    ],
    business: [
      {
        title: "傳統生意 vs 葡眾：零庫存的魅力",
        preview: "遇到想創業但怕風險的朋友，可以這樣跟他們分享...",
        desc: "對比傳統創業需要囤貨、付店租的壓力，葡眾的制度優勢在於『把日常消費轉換成收入』，不需要大量資金就能開啟斜槓事業。",
        script: "很多人想創業但怕虧本，其實現在最流行的是『微創業』。我們團隊很多人都是邊上班邊經營，不用囤貨壓力小很多，哪天有空喝杯咖啡，跟你分享我們怎麼做的！"
      }
    ],
    script: [
      {
        title: "許久未見的朋友，怎麼開口不尷尬？",
        preview: "不要一開口就推銷，透過社群動態找出共通話題...",
        desc: "破冰的關鍵在於『真誠的關心』。先對他最近的生活狀態（旅遊、寵物、小孩、美食）給予正面回應，再自然地帶入健康話題。",
        script: "哈囉好久不見！剛剛滑到你去日本玩的照片，櫻花超美的耶！你氣色看起來超好，最近過得好嗎？"
      }
    ]
  };

  // 當前欲複製的文字暫存
  let currentScriptToCopy = "";

  // 初始載入健康保養區
  window.onload = () => {
    switchTab('health');
  };

  // 切換分頁與渲染卡片
  function switchTab(category) {
    // 處理 Tab 樣式切換
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    event.target.classList.add('active');

    const container = document.getElementById('card-list');
    container.innerHTML = ""; // 清空目前卡片

    const data = mockData[category];
    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      
      // 判斷標籤名稱
      let tagText = category === 'health' ? '保健話題' : category === 'business' ? '事業發展' : '實戰話術';

      card.innerHTML = `
        <span class="card-tag">${tagText}</span>
        <h3 class="card-title">${item.title}</h3>
        <p class="card-preview">${item.preview}</p>
      `;
      
      // 綁定點擊事件，開啟滑出視窗
      card.onclick = () => openSheet(item);
      container.appendChild(card);
    });
  }

  // 開啟底部視窗
  function openSheet(item) {
    document.getElementById('sheet-title').innerText = item.title;
    document.getElementById('sheet-desc').innerText = item.desc;
    document.getElementById('sheet-script').innerText = item.script;
    currentScriptToCopy = item.script;

    // 重置按鈕狀態
    const btn = document.getElementById('copy-btn');
    btn.innerText = "點我複製內文";
    btn.classList.remove('success');

    // 顯示視窗與遮罩
    document.getElementById('bottom-sheet').classList.add('show');
    document.getElementById('overlay').classList.add('show');
  }

  // 關閉底部視窗
  function closeSheet() {
    document.getElementById('bottom-sheet').classList.remove('show');
    document.getElementById('overlay').classList.remove('show');
  }

  // 複製文字功能
  function copyText() {
    navigator.clipboard.writeText(currentScriptToCopy).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.innerText = "已複製 ✅ (可直接貼到 LINE)";
      btn.classList.add('success');
    }).catch(err => {
      alert("複製失敗，請手動複製喔！");
    });
  }
</script>

</body>
</html>
