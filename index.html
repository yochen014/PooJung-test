<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>葡眾每日靈感</title>
<style>
  :root{
    --bg: #FBF6EF;
    --ink: #2B1B24;
    --ink-soft: #5C4A54;
    --wine: #5B2340;
    --wine-deep: #3D1729;
    --gold: #B98B2E;
    --gold-soft: #EFDFB8;
    --green: #4F7942;
    --card-bg: #FFFFFF;
    --chip-bg: #F1E4D8;
    --line: #E7D9CB;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    font-size: 18px;
    line-height: 1.65;
    padding-bottom: 60px;
  }

  h1,h2,h3{
    font-family: "Noto Serif TC", "Source Han Serif TC", serif;
    color: var(--wine-deep);
    margin: 0;
  }

  /* ---------- Header ---------- */
  header{
    background: linear-gradient(160deg, var(--wine) 0%, var(--wine-deep) 100%);
    color: #F9EEDD;
    padding: 28px 20px 34px;
    position: relative;
    overflow: hidden;
  }
  header .grape-motif{
    position:absolute;
    right: -18px;
    top: -10px;
    opacity: 0.18;
  }
  header .eyebrow{
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--gold-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }
  header h1{
    color: #FFFDF8;
    font-size: 28px;
    line-height: 1.3;
  }
  header .date{
    margin-top: 10px;
    font-size: 15px;
    color: #E6C9D3;
  }

  /* ---------- Hero: 今日靈感 ---------- */
  .hero-wrap{
    padding: 0 16px;
    margin-top: -20px;
  }
  .hero{
    background: var(--card-bg);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 10px 30px rgba(61,23,41,0.15);
    border: 1px solid var(--line);
    animation: rise 0.5s ease;
    cursor: pointer;
  }
  @keyframes rise{
    from{opacity:0; transform: translateY(10px);}
    to{opacity:1; transform: translateY(0);}
  }
  .hero .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: var(--gold-soft);
    color: #7A5B14;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 100px;
    margin-bottom: 12px;
  }
  .hero h2{
    font-size: 22px;
    margin-bottom: 10px;
  }
  .hero p{
    color: var(--ink-soft);
    font-size: 17px;
    margin: 0;
  }
  .hero .tap-hint{
    margin-top: 12px;
    font-size: 13.5px;
    color: var(--gold);
    font-weight: 600;
  }

  /* ---------- Filter chips ---------- */
  .chips{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 22px 16px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .chip{
    flex: 0 0 auto;
    background: var(--chip-bg);
    color: var(--wine-deep);
    border: 1px solid transparent;
    padding: 9px 16px;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active{
    background: var(--wine);
    color: #FFF6E9;
  }

  /* ---------- Cards ---------- */
  main{padding: 10px 16px 0;}
  .card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 20px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:active{
    transform: scale(0.98);
  }
  .card .meta{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .grape-dots{
    display:inline-flex;
    gap: 3px;
  }
  .grape-dots span{
    width: 7px; height: 7px;
    border-radius: 50%;
    display:inline-block;
  }
  .cat-company .grape-dots span{ background: var(--wine); }
  .cat-product .grape-dots span{ background: var(--green); }
  .cat-script .grape-dots span{ background: var(--gold); }

  .card .cat-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .card .newbadge{
    margin-left: auto;
    font-size: 12px;
    font-weight: 700;
    color: #9A3B12;
    background: #FCE3D3;
    padding: 2px 8px;
    border-radius: 100px;
  }
  .card h3{
    font-size: 19px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .card p{
    color: var(--ink-soft);
    font-size: 16.5px;
    margin: 0;
  }
  .card .date{
    font-size: 13px;
    color: #A08C97;
    margin-top: 10px;
  }
  .card .readmore{
    font-size: 14px;
    color: var(--wine);
    font-weight: 700;
    margin-top: 10px;
  }

  footer{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 30px 20px 0;
  }

  /* ---------- Detail Modal ---------- */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(43,27,36,0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--bg);
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px 34px;
    animation: slideup 0.25s ease;
  }
  @keyframes slideup{
    from{ transform: translateY(24px); opacity: 0; }
    to{ transform: translateY(0); opacity: 1; }
  }
  .sheet .sheet-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }
  .sheet .close-btn{
    background: var(--chip-bg);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 18px;
    color: var(--wine-deep);
    cursor: pointer;
    flex-shrink: 0;
  }
  .sheet h2{
    font-size: 22px;
    line-height: 1.4;
    margin: 6px 0 14px;
  }
  .sheet .detail-body p{
    color: var(--ink-soft);
    font-size: 16.5px;
    margin: 0 0 14px;
  }
  .sheet .detail-body p:last-child{ margin-bottom: 0; }
</style>
</head>
<body>

<header>
  <svg class="grape-motif" width="140" height="160" viewBox="0 0 140 160" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="70" cy="20" r="14" fill="#F9EEDD"/>
    <circle cx="50" cy="42" r="14" fill="#F9EEDD"/>
    <circle cx="90" cy="42" r="14" fill="#F9EEDD"/>
    <circle cx="35" cy="66" r="14" fill="#F9EEDD"/>
    <circle cx="70" cy="66" r="14" fill="#F9EEDD"/>
    <circle cx="105" cy="66" r="14" fill="#F9EEDD"/>
    <circle cx="52" cy="90" r="14" fill="#F9EEDD"/>
    <circle cx="88" cy="90" r="14" fill="#F9EEDD"/>
    <circle cx="70" cy="112" r="14" fill="#F9EEDD"/>
  </svg>
  <div class="eyebrow">今天也要元氣滿滿</div>
  <h1>葡眾每日靈感</h1>
  <div class="date" id="todayDate"></div>
</header>

<div class="hero-wrap">
  <div class="hero" id="heroCard">
    <div class="tag">🌟 今日精選</div>
    <h2 id="heroTitle"></h2>
    <p id="heroBody"></p>
    <div class="tap-hint">點一下看完整內容 →</div>
  </div>
</div>

<div class="chips" id="chips">
  <button class="chip active" data-cat="all">全部</button>
  <button class="chip" data-cat="company">🍇 公司動態</button>
  <button class="chip" data-cat="product">🌿 產品知識</button>
  <button class="chip" data-cat="script">💬 銷售話術</button>
</div>

<main id="cardList"></main>

<footer>由你親手為媽媽準備 · 每天不同內容,點卡片看更多</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-top">
      <div>
        <span class="tag" id="sheetTag" style="display:inline-block; background:var(--gold-soft); color:#7A5B14; font-size:13px; font-weight:700; padding:4px 10px; border-radius:100px;"></span>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <h2 id="sheetTitle"></h2>
    <div class="detail-body" id="sheetBody"></div>
  </div>
</div>

const allItems = [
  ...companyItems.map(i => ({...i, category:"company"})),
  ...productItems.map(i => ({...i, category:"product"})),
  ...scriptItems.map(i => ({...i, category:"script"}))
];

const catLabel = {company:"公司動態", product:"產品知識", script:"銷售話術"};

// 依照「今天的日期」計算出一個固定但每天不同的索引，讓今日精選每天輪替、不重複，
// 直到把所有內容輪過一遍才會重新循環（目前共 ${allItems.length} 則內容）。
const daysSinceEpoch = Math.floor(Date.now() / 86400000);
const heroIndex = daysSinceEpoch % allItems.length;
const heroItem = allItems[heroIndex];

function openSheet(item){
  document.getElementById('sheetTag').textContent = catLabel[item.category];
  document.getElementById('sheetTitle').textContent = item.title;
  const body = document.getElementById('sheetBody');
  body.innerHTML = item.detail.map(p => `<p>${p}</p>`).join('');
  document.getElementById('overlay').classList.add('show');
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
}

function renderHero(){
  document.getElementById('heroTitle').textContent = heroItem.title;
  document.getElementById('heroBody').textContent = heroItem.body;
  document.getElementById('heroCard').addEventListener('click', () => openSheet(heroItem));
}

function renderCards(filter){
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  const filtered = filter === 'all' ? allItems : allItems.filter(i => i.category === filter);
  filtered.forEach(i => {
    const card = document.createElement('div');
    card.className = 'card';
    const isToday = i === heroItem;
    card.innerHTML = `
      <div class="meta cat-${i.category}">
        <span class="grape-dots"><span></span><span></span><span></span></span>
        <span class="cat-label">${catLabel[i.category]}</span>
        ${isToday ? '<span class="newbadge">今日精選</span>' : ''}
      </div>
      <h3>${i.title}</h3>
      <p>${i.body}</p>
      <div class="readmore">點一下看完整內容 →</div>
      <div class="date">${i.date}</div>
    `;
    card.addEventListener('click', () => openSheet(i));
    list.appendChild(card);
  });
}

document.getElementById('todayDate').textContent =
  new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

document.getElementById('chips').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderCards(btn.dataset.cat);
});

document.getElementById('closeBtn').addEventListener('click', closeSheet);
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeSheet();
});

renderHero();
renderCards('all');
